services:
  dockwatch:
    build: .
    image: homelab-image-scanner:latest
    container_name: dockwatch
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/docker_volume/homelab-image-scanner:/data
    command: ["dockwatch", "run"]

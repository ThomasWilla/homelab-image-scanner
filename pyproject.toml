[project]
name = "homelab-image-scanner"
version = "0.1.0"
description = "Docker image discovery and SBOM upload automation for Dependency-Track"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Thomas Willa" }
]
dependencies = [
  "docker>=7.1.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.scripts]
dockwatch = "dockwatch.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
